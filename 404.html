<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Rudees Digital</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Config -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Space Grotesk', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#fff7ed',
                            100: '#ffedd5',
                            200: '#fed7aa',
                            300: '#fdba74',
                            400: '#fb923c',
                            500: '#f97316',
                            600: '#ea580c',
                            700: '#c2410c',
                            800: '#9a3412',
                            900: '#7c2d12',
                        },
                        accent: {
                            DEFAULT: '#f97316', // Orange 500
                            secondary: '#fb923c', // Orange 400
                        }
                    },
                    backgroundImage: {
                        'gradient-brand': 'linear-gradient(to right, #f97316 0%, #fb923c 100%)',
                        'hero-pattern': 'radial-gradient(circle at 15% 50%, rgba(249, 115, 22, 0.15), transparent 25%), radial-gradient(circle at 85% 30%, rgba(251, 146, 60, 0.15), transparent 25%)'
                    }
                }
            }
        }
    </script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-display { font-family: 'Space Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-orange-50 text-gray-900 antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
    
    <!-- Background Elements -->
    <div class="absolute inset-0 bg-hero-pattern opacity-50"></div>
    <div class="absolute top-1/4 -left-32 w-64 h-64 bg-accent/20 rounded-full blur-[100px]"></div>
    <div class="absolute bottom-1/4 -right-32 w-64 h-64 bg-orange-400/20 rounded-full blur-[100px]"></div>

    <div class="relative z-10 text-center px-4 max-w-2xl mx-auto">
        <div class="mb-8 flex justify-center">
            <div class="w-24 h-24 bg-white rounded-3xl border border-orange-100 flex items-center justify-center transform rotate-12 shadow-xl">
                <i data-lucide="compass" class="w-12 h-12 text-accent"></i>
            </div>
        </div>
        
        <h1 class="font-display text-8xl md:text-9xl font-bold text-transparent bg-clip-text bg-gradient-brand mb-4">
            404
        </h1>
        
        <h2 class="font-display text-2xl md:text-3xl font-bold mb-6 text-brand-900">
            Looks like you're lost in the digital space.
        </h2>
        
        <p class="text-gray-600 text-lg mb-10 max-w-lg mx-auto">
            The page you're looking for doesn't exist, has been moved, or is temporarily unavailable. Let's get you back on track.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="/" class="px-8 py-4 rounded-full bg-gradient-brand text-white font-bold hover:shadow-[0_0_20px_rgba(249,115,22,0.4)] transition-all transform hover:-translate-y-1 flex items-center justify-center gap-2">
                <i data-lucide="home" class="w-5 h-5"></i>
                Return Home
            </a>
            <button onclick="window.history.back()" class="px-8 py-4 rounded-full border border-gray-300 text-gray-700 font-semibold hover:bg-gray-100 transition-all flex items-center justify-center gap-2">
                <i data-lucide="arrow-left" class="w-5 h-5"></i>
                Go Back
            </button>
        </div>
    </div>

    <!-- Initialize Icons -->
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
